# Propose automatiquement des mises à jour (pull requests) quand une dépendance a une nouvelle version ou une faille.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependances:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Les changements de version majeure de Node (ex. 24 → 26) se font à la main, vers une version LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
